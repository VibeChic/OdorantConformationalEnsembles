# Reference lock for landscape-md:1.1.
# Generated from the production environment that produced the manuscript.
# The built image (docker build -t landscape-md:1.1 container/) is authoritative;
# this file records the versions used for the reported numbers.
name: landscape-md
channels:
  - conda-forge
dependencies:
  - python=3.12
  - xtb=6.7.1
  - rdkit=2026.03.3
  - openmm=8.6.1
  - openff-toolkit=0.16.*
  - openff-forcefields=2024.09.0
  - numpy=1.26.4
  - pandas=2.2.2
  - scipy=1.14.1
  - matplotlib=3.11.0
  - scikit-learn=1.5.2
  - statsmodels=0.14.*
  - pytorch=2.3.1
  - cpuonly
  - pyg=2.5.*
  - pip
  - pip:
      - requests>=2.32
      - tqdm>=4.66
